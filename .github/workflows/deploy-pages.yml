name: Verify GitHub Pages sync

# This repo's GitHub Pages source is configured as "Deploy from a branch"
# (main:/docs) — GitHub deploys that folder automatically on every push to
# main via its own built-in "pages build and deployment" pipeline. This
# workflow used to ALSO deploy the same commit via actions/deploy-pages,
# and the two deployments raced against each other for the same commit,
# frequently causing one (or both) of them to fail with
# "Deployment failed, try again later." — leaving the live site stale even
# though the underlying commit was fine.
#
# To stop that race for good, this workflow now ONLY verifies that docs/
# actually mirrors the root web app files (i.e. `npm run pages:sync` was run
# before committing). It intentionally does NOT call actions/deploy-pages —
# GitHub's own legacy branch-based builder is the sole deployer.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: verify-pages-sync
  cancel-in-progress: true

jobs:
  verify-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify docs/ is in sync with the web app source files
        run: node ./scripts/sync-web-to-docs.js

      - name: Fail if docs/ drifted from the source (forgot to run pages:sync)
        run: |
          if [ -n "$(git status --porcelain docs)" ]; then
            echo "::error::docs/ is out of sync with the root web app files. Run 'npm run pages:sync' and commit the result." >&2
            git status --porcelain docs
            exit 1
          fi
